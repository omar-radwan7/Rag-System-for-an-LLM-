# Adds NVIDIA GPU access. Needs the NVIDIA driver and the NVIDIA Container Toolkit:
# https://docs.nvidia.com/datacenter/cloud-native/container-toolkit/install-guide.html
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up
# Ollama then runs the model on the GPU, and the model check sees the GPU memory
# and can pick a larger model.
x-gpu: &gpu
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: [gpu]

services:
  ollama: *gpu
  model: *gpu
  app: *gpu
