# One command start on any machine with Docker:   docker compose up
# With an NVIDIA GPU:   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up
# Then open http://localhost:8501
services:
  ollama:
    image: ollama/ollama:0.40.13
    volumes:
      - ollama:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      retries: 30

  # Checks RAM, GPU memory and free disk, downloads the best model that fits
  # (or the one named in config.json), then exits
  model:
    image: document-rag:local
    build: .
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODELS: /ollama/models
    volumes:
      - ollama:/ollama:ro
    command: ["python", "-m", "rag.model_catalog", "--pull"]

  app:
    image: document-rag:local
    build: .
    depends_on:
      model:
        condition: service_completed_successfully
    environment:
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODELS: /ollama/models   # for the free disk check in "Get more models"
    volumes:
      - huggingface:/cache/huggingface
      - ollama:/ollama:ro
    ports:
      - "8501:8501"

volumes:
  ollama:
  huggingface:
